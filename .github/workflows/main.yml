name: CI

on:
  pull_request:
    branches:
      - master
  schedule:
    - cron:  '13 */4 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.25.7']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Test source code
      run:  script/test-source

    - name: Test build
      run:  script/test-build

    - name: Test unit
      run:  script/test-unit

    - name: Update packages
      run:  sudo apt-get update

    - name: Set up SQLite
      run:  sudo apt-get install sqlite3

    - name: Start local MySQL
      run:  sudo /etc/init.d/mysql start

    - name: Test integration
      run:  script/test-integration

    - name: Test documentation
      run:  script/test-docs

    - name: Upload orchestrator binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: orchestrator-go${{ matrix.go-version }}
        path: bin/orchestrator

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.7'
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

  security:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.7'
        cache: true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...
