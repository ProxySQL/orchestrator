name: Release tools

on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'script/release.py'
      - 'script/sign-release.py'
      - 'tests/release/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/release*.yml'
      - 'script/release.py'
      - 'script/sign-release.py'
      - 'tests/release/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install signing and verification tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gnupg rpm
        command -v gpg rpm rpmkeys rpmbuild rpmsign
    - name: Test inventory, release guards and real signing
      run: python3 -m unittest discover -s tests/release -v
