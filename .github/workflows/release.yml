name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.7'
        cache: true

    - name: Install fpm and rpmbuild
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev build-essential rpm
        sudo gem install --no-document fpm

    - name: Build and package
      env:
        TAG_NAME: ${{ github.ref_name }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        # strip leading 'v' from tag for package versions
        export RELEASE_VERSION="${TAG_NAME#v}"
        export GOPATH="$(go env GOPATH)"
        ./build.sh -a "$GOARCH"

    - name: Collect artifacts
      run: |
        mkdir -p dist
        shopt -s nullglob
        cp /tmp/orchestrator-release/*.tar.gz dist/ 2>/dev/null || true
        cp /tmp/orchestrator-release/*.deb    dist/ 2>/dev/null || true
        cp /tmp/orchestrator-release/*.rpm    dist/ 2>/dev/null || true
        ls -la dist/

    - name: Upload unsigned package stage
      uses: actions/upload-artifact@v4
      with:
        name: orchestrator-packages-${{ matrix.goarch }}
        path: dist/*
        if-no-files-found: error
        retention-days: 14

  validate-package-stage:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download package stages
      uses: actions/download-artifact@v4
      with:
        pattern: orchestrator-packages-*
        path: dist
        merge-multiple: true

    - name: Validate unsigned package stage
      env:
        TAG_NAME: ${{ github.ref_name }}
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        version="${TAG_NAME#v}"
        test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
        script/release-artifacts validate-unsigned "${version}" dist
        script/release-artifacts validate-packages "${version}" dist
        script/release-artifacts write-unsigned-checksums \
          "${version}" dist unsigned-SHA256SUMS

    - name: Upload unsigned manifest
      uses: actions/upload-artifact@v4
      with:
        name: orchestrator-unsigned-manifest
        path: unsigned-SHA256SUMS
        if-no-files-found: error
        retention-days: 14

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=ghcr.io/proxysql/orchestrator,push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p /tmp/digests
        touch "/tmp/digests/${DIGEST#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 14
