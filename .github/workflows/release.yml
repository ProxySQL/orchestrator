name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-packages:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.7'
        cache: true

    - name: Install fpm and rpmbuild
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev build-essential rpm
        sudo gem install --no-document fpm

    - name: Build and package
      env:
        TAG_NAME: ${{ github.ref_name }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        # strip leading 'v' from tag for package versions
        export RELEASE_VERSION="${TAG_NAME#v}"
        export GOPATH="$(go env GOPATH)"
        ./build.sh -a "$GOARCH"

    - name: Collect and validate packages
      env:
        TAG_NAME: ${{ github.ref_name }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir dist
        shopt -s failglob
        cp /tmp/orchestrator-release/*.tar.gz /tmp/orchestrator-release/*.deb /tmp/orchestrator-release/*.rpm dist/
        python3 script/release.py check-packages "$TAG_NAME" dist --arch "$GOARCH"

    - name: Upload intermediate packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.goarch }}
        path: dist/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  draft-release:
    concurrency:
      group: package-draft-${{ github.ref }}
      cancel-in-progress: false
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download amd64 packages
      uses: actions/download-artifact@v4
      with:
        name: packages-amd64
        path: dist

    - name: Download arm64 packages
      uses: actions/download-artifact@v4
      with:
        name: packages-arm64
        path: dist

    - name: Validate complete inventory and record build provenance
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: python3 script/release.py build-info "$TAG_NAME" dist

    - name: Create draft for manual signing
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
        PRERELEASE: ${{ contains(github.ref_name, 'rc') }}
      run: |
        # List drafts as well as published releases. An API failure stops this step.
        existing_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
        while IFS= read -r existing_tag; do
          if [[ "$existing_tag" == "$TAG_NAME" ]]; then
            echo "Release $TAG_NAME already exists; refusing to overwrite or duplicate it." >&2
            exit 1
          fi
        done <<< "$existing_tags"
        extra=()
        if [[ "$PRERELEASE" == "true" ]]; then
          extra+=(--prerelease)
        fi
        gh release create "$TAG_NAME" dist/* \
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --verify-tag --draft --generate-notes "${extra[@]}"

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=ghcr.io/proxysql/orchestrator,push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p /tmp/digests
        touch "/tmp/digests/${DIGEST#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  docker-merge:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        pattern: digests-*
        path: /tmp/digests
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/proxysql/orchestrator
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ !contains(github.ref_name, 'rc') }}

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf 'ghcr.io/proxysql/orchestrator@sha256:%s ' *)

    - name: Inspect image
      env:
        VERSION: ${{ steps.meta.outputs.version }}
      run: |
        docker buildx imagetools inspect "ghcr.io/proxysql/orchestrator:${VERSION}"
