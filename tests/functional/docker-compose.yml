version: "3.8"

services:
  mysql1:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    hostname: mysql1
    environment:
      MYSQL_ROOT_PASSWORD: testpass
    ports:
      - "13306:3306"
    volumes:
      - ./mysql/master.cnf:/etc/mysql/conf.d/repl.cnf
      - ./mysql/init-master.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptestpass"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      orchnet:
        ipv4_address: 172.30.0.10
        aliases:
          - mysql1

  mysql2:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    hostname: mysql2
    environment:
      MYSQL_ROOT_PASSWORD: testpass
    ports:
      - "13307:3306"
    volumes:
      - ./mysql/replica.cnf:/etc/mysql/conf.d/repl.cnf
      - ./mysql/init-replica.sql:/docker-entrypoint-initdb.d/init.sql
    depends_on:
      mysql1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptestpass"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      orchnet:
        ipv4_address: 172.30.0.11
        aliases:
          - mysql2

  mysql3:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    hostname: mysql3
    environment:
      MYSQL_ROOT_PASSWORD: testpass
    ports:
      - "13308:3306"
    volumes:
      - ./mysql/replica2.cnf:/etc/mysql/conf.d/repl.cnf
      - ./mysql/init-replica.sql:/docker-entrypoint-initdb.d/init.sql
    depends_on:
      mysql1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptestpass"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      orchnet:
        ipv4_address: 172.30.0.12
        aliases:
          - mysql3

  proxysql:
    image: proxysql/proxysql:latest
    hostname: proxysql
    ports:
      - "16032:6032"
      - "16033:6033"
    volumes:
      - ./proxysql/proxysql.cnf:/etc/proxysql.cnf
    depends_on:
      mysql1:
        condition: service_healthy
      mysql2:
        condition: service_healthy
      mysql3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P6032", "-uradmin", "-pradmin"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      orchnet:
        ipv4_address: 172.30.0.13
        aliases:
          - proxysql

  pgprimary:
    image: ${PG_IMAGE:-postgres:17}
    hostname: pgprimary
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_USER: postgres
    volumes:
      - pgprimary-data:/var/lib/postgresql/data
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      orchnet:
        ipv4_address: 172.30.0.20
        aliases:
          - pgprimary

  pgstandby1:
    image: ${PG_IMAGE:-postgres:17}
    hostname: pgstandby1
    environment:
      POSTGRES_PASSWORD: testpass
      PGUSER: postgres
      PGPASSWORD: repl_pass
    volumes:
      - pgstandby1-data:/var/lib/postgresql/data
      - ./postgres/init-standby.sh:/init-standby.sh
    entrypoint: ["/bin/bash", "/init-standby.sh"]
    depends_on:
      pgprimary:
        condition: service_healthy
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      orchnet:
        ipv4_address: 172.30.0.21
        aliases:
          - pgstandby1

  orchestrator:
    image: orchestrator-runtime:latest
    hostname: orchestrator
    volumes:
      - ../../bin/orchestrator:/usr/local/bin/orchestrator:ro
      - ../../resources:/orchestrator/resources:ro
      - ./orchestrator-test.conf.json:/orchestrator/orchestrator.conf.json:ro
    command: >
      bash -c "
        rm -f /tmp/orchestrator-test.sqlite3 &&
        cd /orchestrator &&
        orchestrator -config orchestrator.conf.json http
      "
    ports:
      - "3099:3099"
    depends_on:
      proxysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3099/api/clusters"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    networks:
      orchnet:
        ipv4_address: 172.30.0.30
        aliases:
          - orchestrator

  orchestrator-pg:
    image: orchestrator-runtime:latest
    hostname: orchestrator-pg
    volumes:
      - ../../bin/orchestrator:/usr/local/bin/orchestrator:ro
      - ../../resources:/orchestrator/resources:ro
      - ./orchestrator-pg-test.conf.json:/orchestrator/orchestrator.conf.json:ro
    command: >
      bash -c "
        rm -f /tmp/orchestrator-pg-test.sqlite3 &&
        cd /orchestrator &&
        orchestrator -config orchestrator.conf.json http
      "
    ports:
      - "3098:3098"
    depends_on:
      pgprimary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3098/api/clusters"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    networks:
      orchnet:
        ipv4_address: 172.30.0.31
        aliases:
          - orchestrator-pg

  orchestrator-raft1:
    image: orchestrator-runtime:latest
    hostname: orchestrator-raft1
    volumes:
      - ../../bin/orchestrator:/usr/local/bin/orchestrator:ro
      - ../../resources:/orchestrator/resources:ro
      - ./orchestrator-raft1.conf.json:/orchestrator/orchestrator.conf.json:ro
    command: >
      bash -c "
        mkdir -p /tmp/raft1 &&
        cd /orchestrator &&
        orchestrator -config orchestrator.conf.json http
      "
    ports:
      - "3100:3099"
    depends_on:
      mysql1:
        condition: service_healthy
    networks:
      orchnet:
        ipv4_address: 172.30.0.40
        aliases:
          - orchestrator-raft1

  orchestrator-raft2:
    image: orchestrator-runtime:latest
    hostname: orchestrator-raft2
    volumes:
      - ../../bin/orchestrator:/usr/local/bin/orchestrator:ro
      - ../../resources:/orchestrator/resources:ro
      - ./orchestrator-raft2.conf.json:/orchestrator/orchestrator.conf.json:ro
    command: >
      bash -c "
        mkdir -p /tmp/raft2 &&
        cd /orchestrator &&
        orchestrator -config orchestrator.conf.json http
      "
    ports:
      - "3101:3099"
    depends_on:
      mysql1:
        condition: service_healthy
    networks:
      orchnet:
        ipv4_address: 172.30.0.41
        aliases:
          - orchestrator-raft2

  orchestrator-raft3:
    image: orchestrator-runtime:latest
    hostname: orchestrator-raft3
    volumes:
      - ../../bin/orchestrator:/usr/local/bin/orchestrator:ro
      - ../../resources:/orchestrator/resources:ro
      - ./orchestrator-raft3.conf.json:/orchestrator/orchestrator.conf.json:ro
    command: >
      bash -c "
        mkdir -p /tmp/raft3 &&
        cd /orchestrator &&
        orchestrator -config orchestrator.conf.json http
      "
    ports:
      - "3102:3099"
    depends_on:
      mysql1:
        condition: service_healthy
    networks:
      orchnet:
        ipv4_address: 172.30.0.42
        aliases:
          - orchestrator-raft3

volumes:
  pgprimary-data:
  pgstandby1-data:

networks:
  orchnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
